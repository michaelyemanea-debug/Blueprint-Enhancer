kind = "web"
previewPath = "/"
title = "YDHAR Asset Valuation"
version = "1.0.0"
id = "artifacts/ydhar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24052

[services.development]
run = "pnpm --filter @workspace/ydhar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ydhar", "run", "build" ]
serve = "static"
publicDir = "artifacts/ydhar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24052"
BASE_PATH = "/"
